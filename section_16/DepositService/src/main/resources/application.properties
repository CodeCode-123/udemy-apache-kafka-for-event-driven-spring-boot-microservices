spring.application.name=DepositService
server.port=0
spring.kafka.consumer.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=amount-deposit-event
spring.kafka.consumer.properties.spring.json.trusted.packages=com.appsdeveloperblog.*

spring.kafka.consumer.isolation-level=READ_COMMITTED
logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.kafka.listener.ConcurrentMessageListenerContainer=INFO